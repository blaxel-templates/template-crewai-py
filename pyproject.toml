[project]
name = "template-crewai-py"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "blaxel[crewai,telemetry]==0.4.20",
    "fastapi[standard]>=0.115.12",
    "nest-asyncio>=1.6.0",
    "rich>=13.9.4",
]
[dependency-groups]
dev = ["ruff>=0.8.2"]

[tool.ruff]
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F"]

[tool.uv]
constraint-dependencies = ["fsspec>=2026.6.0", "pdfminer.six>=20251230", "pillow>=13.0.0", "uv>=0.13.4"]
